spring:
  application:
    name: claims-service
  datasource:
    url: jdbc:postgresql://localhost:5432/chubb
    username: chubb
    password: chubb
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway; Hibernate only verifies it
    properties:
      hibernate:
        default_schema: claims
  flyway:
    schemas: claims
    default-schema: claims
    create-schemas: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
    issuer: https://claims-service.local
    ttl-minutes: 60
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
