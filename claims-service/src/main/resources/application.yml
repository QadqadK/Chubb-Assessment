spring:
  application:
    name: claims-service
  datasource:
    url: jdbc:postgresql://localhost:5432/chubb
    username: chubb
    password: chubb
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway; Hibernate only verifies it
    properties:
      hibernate:
        default_schema: claims
  flyway:
    schemas: claims
    default-schema: claims
    create-schemas: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
    issuer: https://claims-service.local
    ttl-minutes: 60
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  outbox:
    publisher-enabled: true
    poll-interval-ms: 1000
    initial-delay-ms: 2000
    batch-size: 100
  kafka:
    topics-enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
