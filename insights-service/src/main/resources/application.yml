spring:
  application:
    name: insights-service
  datasource:
    url: jdbc:postgresql://localhost:5432/chubb
    username: chubb
    password: chubb
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: insights
  flyway:
    schemas: insights
    default-schema: insights
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: insights-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
    issuer: https://claims-service.local
  kafka:
    topics-enabled: true
    dlt-topic: claim.dead-letter

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
